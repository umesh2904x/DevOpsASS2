name: Q1 CD - Deploy

on:
  push:
    tags: ['v1.0.0']
  workflow_dispatch:

defaults:
  run:
    working-directory: q1-ci-cd-pipeline

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: q1-ci-cd-pipeline
          push: true
          tags: |
            ${{ steps.ver.outputs.IMAGE }}:${{ steps.ver.outputs.VERSION }}
            ${{ steps.ver.outputs.IMAGE }}:latest

      - name: Deploy using Docker Compose
        run: |
          export APP_VERSION=${{ steps.ver.outputs.VERSION }}
          export GIT_COMMIT=${{ github.sha }}
          docker compose up -d --build
          echo "=========== docker compose ps ==========="
          docker compose ps

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API is up after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "API never came up"; docker compose logs; exit 1

      - name: Smoke test the API
        run: |
          echo "--- GET /api/health ---"
          curl -sf http://localhost:3000/api/health; echo ""
          echo "--- GET /api/tasks ---"
          curl -sf http://localhost:3000/api/tasks; echo ""
          echo "--- POST /api/tasks ---"
          curl -sf -X POST http://localhost:3000/api/tasks \
            -H 'Content-Type: application/json' \
            -d '{"title":"Deployed from CI"}'; echo ""
          echo "--- PUT /api/tasks/1 ---"
          curl -sf -X PUT http://localhost:3000/api/tasks/1 \
            -H 'Content-Type: application/json' -d '{"done":true}'; echo ""
          echo "--- DELETE /api/tasks/3 ---"
          curl -sf -X DELETE http://localhost:3000/api/tasks/3; echo ""
          echo "--- GET /metrics ---"
          curl -sf http://localhost:3000/metrics

      - name: Generate traffic for monitoring
        run: |
          for i in $(seq 1 80); do
            curl -sf http://localhost:3000/api/health > /dev/null
            curl -sf http://localhost:3000/api/tasks > /dev/null
            curl -sf -X POST http://localhost:3000/api/tasks \
              -H 'Content-Type: application/json' \
              -d "{\"title\":\"Traffic task $i\"}" > /dev/null
            sleep 0.5
          done
          sleep 20
          echo "traffic generated"

      - name: Verify Prometheus and Grafana
        run: |
          echo "--- prometheus health ---"
          curl -sf http://localhost:9090/-/healthy; echo ""
          echo "--- prometheus targets ---"
          curl -s 'http://localhost:9090/api/v1/targets' \
            | python -c "import sys,json;d=json.load(sys.stdin);[print(t['labels']['job'],'->',t['health']) for t in d['data']['activeTargets']]"
          echo "--- prometheus query: task_api_requests_total ---"
          curl -s 'http://localhost:9090/api/v1/query?query=task_api_requests_total' | python -m json.tool | head -30
          echo "--- prometheus query: task_api_up ---"
          curl -s 'http://localhost:9090/api/v1/query?query=task_api_up' | python -m json.tool | head -30
          echo "--- grafana health ---"
          curl -sf http://localhost:3001/api/health; echo ""

      - name: Capture Grafana dashboard screenshot
        run: |
          mkdir -p evidence
          npx --yes playwright@1.47.0 install --with-deps chromium
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
            await page.goto('http://localhost:3001/login', { waitUntil: 'networkidle' });
            await page.fill('input[name="user"]', 'admin');
            await page.fill('input[name="password"]', 'admin123');
            await page.click('button[type="submit"]');
            await page.waitForTimeout(4000);
            await page.goto('http://localhost:3001/d/task-api-devops', { waitUntil: 'networkidle' });
            await page.waitForTimeout(12000);
            await page.screenshot({ path: 'evidence/grafana-dashboard.png', fullPage: true });
            await page.goto('http://localhost:9090/targets', { waitUntil: 'networkidle' });
            await page.waitForTimeout(4000);
            await page.screenshot({ path: 'evidence/prometheus-targets.png', fullPage: true });
            await browser.close();
            console.log('screenshots saved to evidence/');
          })();
          JS

      - name: Save logs as evidence
        if: always()
        run: |
          mkdir -p evidence
          docker compose ps > evidence/compose-ps.txt 2>&1
          docker compose logs --tail 200 > evidence/container-logs.txt 2>&1
          curl -sf http://localhost:3000/metrics > evidence/metrics.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-deployment-evidence
          path: q1-ci-cd-pipeline/evidence/

      - name: Container logs
        if: always()
        run: docker compose logs --tail 40

      - name: Deployment summary
        run: |
          {
            echo "### Q1 Deployment Successful"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Image | \`${{ steps.ver.outputs.IMAGE }}:${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deployed by | \`${{ github.actor }}\` |"
            echo "| Run | \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\` |"
            echo ""
            echo "Evidence artifact: \`q1-deployment-evidence\`"
          } >> $GITHUB_STEP_SUMMARY
