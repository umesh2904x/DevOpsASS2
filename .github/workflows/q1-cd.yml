name: Q1 CD - Deploy

on:
  push:
    tags: ['v1.0.0']
  workflow_dispatch:

defaults:
  run:
    working-directory: q1-ci-cd-pipeline

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: q1-ci-cd-pipeline
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Deploy using Docker Compose
        run: |
          export APP_VERSION=${{ steps.ver.outputs.VERSION }}
          docker compose up -d --build
          docker compose ps

      - name: Smoke test
        run: |
          sleep 20
          curl -f http://localhost:3000/api/health
          curl -sf http://localhost:3000/metrics | head -5

      - name: Container logs
        if: always()
        run: docker compose logs --tail 40

      - name: Deployment summary
        run: |
          {
            echo "### Q1 Deployment Successful"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Image | \`ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
