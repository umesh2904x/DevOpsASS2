name: Q1 CI - Build and Test

on:
  push:
    branches: [main, develop]
    paths: ['q1-ci-cd-pipeline/**']
  pull_request:
    branches: [main, develop]
    paths: ['q1-ci-cd-pipeline/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: q1-ci-cd-pipeline

jobs:
  build-test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: q1-ci-cd-pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run coverage

      - name: Build artifact
        run: npm run build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: q1-build-info
          path: q1-ci-cd-pipeline/dist/

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: q1-ci-cd-pipeline
          push: false
          tags: task-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
