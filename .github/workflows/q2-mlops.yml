name: Q2 MLOps - Train, Register, Deploy, Monitor

on:
  push:
    branches: [main]
    paths: ['q2-mlflow-mlops/**']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

defaults:
  run:
    working-directory: q2-mlflow-mlops

jobs:
  train:
    name: Track experiments and register model
    runs-on: ubuntu-latest

    services:
      mlflow:
        image: ghcr.io/mlflow/mlflow:v2.16.2
        ports:
          - 5000:5000
        env:
          MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
          MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
        options: >-
          --health-cmd "curl -f http://localhost:5000/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: q2-mlflow-mlops/requirements.txt

      - run: pip install -r requirements.txt

      - name: Train, log params and metrics, register model
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: python train.py --tracking-uri http://localhost:5000

      - name: Experiment comparison in job summary
        run: |
          echo "### MLflow Experiment: breast-cancer-classifier" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import mlflow
          mlflow.set_tracking_uri("http://localhost:5000")
          e = mlflow.get_experiment_by_name("breast-cancer-classifier")
          df = mlflow.search_runs([e.experiment_id], order_by=["metrics.f1 DESC"])
          cols = ["run_name", "metrics.accuracy", "metrics.precision",
                  "metrics.recall", "metrics.f1", "metrics.roc_auc"]
          print(df[cols].to_markdown(index=False))
          PY

      - name: Model registry versions
        run: |
          echo "### Model Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import mlflow
          mlflow.set_tracking_uri("http://localhost:5000")
          c = mlflow.MLflowClient()
          for mv in c.search_model_versions("name='cancer-detector'"):
              print(f"- version `{mv.version}` run `{mv.run_id[:8]}` tags `{dict(mv.tags)}` aliases `{mv.aliases}`")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: q2-scaler
          path: q2-mlflow-mlops/scaler.pkl

  test:
    name: Verify serving module
    runs-on: ubuntu-latest
    needs: train
    defaults:
      run:
        working-directory: q2-mlflow-mlops

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import check
        run: python -c "import serve_model; print('serve_model imports cleanly')"

  deploy:
    name: Deploy model API with Docker Compose
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: q2-mlflow-mlops

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: q2-mlflow-mlops
          push: false
          tags: mlops-model-api:${{ github.sha }}

      - name: Start MLflow and model server
        run: docker compose up -d mlflow model-server

      - name: Wait and smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then echo "API UP"; break; fi
            sleep 5
          done
          curl -sf http://localhost:8000/health
          echo ""
          curl -sf http://localhost:8000/metrics | head -10

      - name: Container logs
        if: always()
        run: docker compose logs --tail 40

  monitor:
    name: Verify Prometheus and Grafana
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: q2-mlflow-mlops

    steps:
      - uses: actions/checkout@v4

      - name: Start monitoring stack
        run: docker compose up -d prometheus grafana

      - name: Prometheus healthy
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9090/-/healthy > /dev/null; then echo "PROM UP"; break; fi
            sleep 5
          done
          curl -sf http://localhost:9090/-/healthy

      - name: Prometheus targets
        run: |
          curl -s 'http://localhost:9090/api/v1/targets' \
            | python -c "import sys,json;d=json.load(sys.stdin);[print(t['labels']['job'],'->',t['health']) for t in d['data']['activeTargets']]"

      - name: Grafana healthy
        run: |
          sleep 10
          curl -sf http://localhost:3001/api/health

      - name: Cleanup
        if: always()
        run: docker compose down -v
