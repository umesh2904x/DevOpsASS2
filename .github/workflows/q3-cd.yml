name: Q3 CD - Continuous Deployment

on:
  push:
    tags: ['v1.0.0']
  workflow_dispatch:

defaults:
  run:
    working-directory: q3-end-to-end-devops

jobs:
  deploy:
    name: Deploy Full Stack
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: q3-end-to-end-devops
          push: true
          tags: |
            ${{ steps.ver.outputs.IMAGE }}:${{ steps.ver.outputs.VERSION }}
            ${{ steps.ver.outputs.IMAGE }}:latest

      - name: Deploy stack
        run: |
          export APP_VERSION=${{ steps.ver.outputs.VERSION }}
          export GIT_COMMIT=${{ github.sha }}
          export BUILD_NUMBER=${{ github.run_number }}
          docker compose up -d --build
          docker compose ps

      - name: Smoke tests
        run: |
          sleep 20
          echo "--- app health ---"
          curl -sf http://localhost:3000/api/health
          echo ""
          echo "--- metrics ---"
          curl -sf http://localhost:3000/metrics | head -15
          echo ""
          echo "--- place an order ---"
          curl -sf -X POST http://localhost:3000/api/orders \
            -H 'Content-Type: application/json' \
            -d '{"items":[{"bookId":1,"qty":1}]}'
          echo ""
          echo "--- prometheus ---"
          curl -sf http://localhost:9090/-/healthy
          curl -s 'http://localhost:9090/api/v1/targets' \
            | python -c "import sys,json;d=json.load(sys.stdin);[print(t['labels']['job'],'->',t['health']) for t in d['data']['activeTargets']]"
          echo "--- grafana ---"
          curl -sf http://localhost:3001/api/health
          echo "--- alertmanager ---"
          curl -sf http://localhost:9093/-/healthy

      - name: Container logs
        if: always()
        run: docker compose logs --tail 60

      - name: Deployment summary
        run: |
          {
            echo "## Q3 Deployment Report"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`${{ steps.ver.outputs.IMAGE }}:${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Deployed by | \`${{ github.actor }}\` |"
            echo "| Run | \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\` |"
          } >> $GITHUB_STEP_SUMMARY
