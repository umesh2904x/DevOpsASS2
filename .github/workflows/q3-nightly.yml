name: Q3 Nightly - Monitoring Verification

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: q3-end-to-end-devops

jobs:
  verify:
    name: Verify Monitoring Stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d

      - name: Wait for app to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "app is up"; exit 0
            fi
            sleep 5
          done
          echo "app never came up"
          docker compose logs
          exit 1

      - name: Generate traffic so dashboards have data
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null
            curl -sf -X POST http://localhost:3000/api/books \
              -H 'Content-Type: application/json' \
              -d "{\"title\":\"Nightly Book $i\",\"price\":199}" > /dev/null
            curl -sf -X POST http://localhost:3000/api/orders \
              -H 'Content-Type: application/json' \
              -d '{"items":[{"bookId":1,"qty":1}]}' > /dev/null
          done
          curl -sf http://localhost:3000/metrics

      - name: Check Prometheus targets and alerts
        run: |
          echo "--- targets ---"
          curl -s 'http://localhost:9090/api/v1/targets' \
            | python -c "import sys,json;d=json.load(sys.stdin);[print(t['labels']['job'],'->',t['health']) for t in d['data']['activeTargets']]"
          echo "--- alerts ---"
          curl -s 'http://localhost:9090/api/v1/alerts' \
            | python -c "import sys,json;d=json.load(sys.stdin);print('alert rules loaded:',len(d['data']['alerts']));[print(' -',a['labels']['alertname'],a['state']) for a in d['data']['alerts']]"

      - name: Check Grafana and Alertmanager
        run: |
          curl -sf http://localhost:3001/api/health
          echo ""
          curl -sf http://localhost:9093/-/healthy

      - name: Monitoring summary
        run: |
          {
            echo "### Nightly Monitoring Check"
            echo ""
            echo "- bookstore health: \`$(curl -sf http://localhost:3000/api/health | head -c 200)\`"
            echo "- targets: \`$(curl -s http://localhost:9090/api/v1/targets | python -c "import sys,json;d=json.load(sys.stdin);print([(t['labels']['job'],t['health']) for t in d['data']['activeTargets']])")\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Save logs as evidence
        if: always()
        run: |
          mkdir -p evidence
          docker compose ps > evidence/compose-ps.txt
          docker compose logs --tail 200 > evidence/container-logs.txt
          curl -s http://localhost:3000/metrics > evidence/metrics.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-monitoring-evidence
          path: q3-end-to-end-devops/evidence/

      - name: Cleanup
        if: always()
        run: docker compose down -v
