name: MLOps - Train, Register and Deploy Model

on:
  push:
    branches: [main]
    paths:
      - 'train.py'
      - 'serve_model.py'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  train:
    name: Train model and track with MLflow
    runs-on: ubuntu-latest

    services:
      mlflow:
        image: ghcr.io/mlflow/mlflow:v2.16.2
        ports:
          - 5000:5000
        env:
          MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
          MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
        options: >-
          --health-cmd "curl -f http://localhost:5000/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train and register model
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: python train.py --tracking-uri http://localhost:5000

      - name: Summary of experiments
        run: |
          echo "### MLflow Experiment: breast-cancer-classifier" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import mlflow, pandas as pd
          mlflow.set_tracking_uri("http://localhost:5000")
          e = mlflow.get_experiment_by_name("breast-cancer-classifier")
          df = mlflow.search_runs([e.experiment_id], order_by=["metrics.f1 DESC"])
          cols = ["run_name","metrics.accuracy","metrics.precision","metrics.recall","metrics.f1","metrics.roc_auc"]
          print(df[cols].to_markdown(index=False))
          PY

      - name: Save scaler artifact
        uses: actions/upload-artifact@v4
        with:
          name: scaler
          path: scaler.pkl

  test:
    name: Unit test inference API
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify serving module imports
        run: python -c "import serve_model; print('serve_model imports cleanly')"

  deploy:
    name: Deploy model API with Docker Compose
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mlops-model-api:${{ github.sha }}
      - name: Start stack
        run: docker compose up -d mlflow model-server
      - name: Smoke test /health
        run: |
          sleep 45
          curl -f http://localhost:8000/health
      - name: Smoke test /predict
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"instances":[{"mean radius":17.4,"mean texture":19.2,"mean perimeter":122.0,"mean area":1001.0,"mean smoothness":0.098,"mean compactness":0.15,"mean concavity":0.14,"mean concave points":0.08,"mean symmetry":0.19,"mean fractal dimension":0.05,"radius error":1.2,"texture error":1.4,"perimeter error":12.0,"area error":90.0,"smoothness error":0.006,"compactness error":0.02,"concavity error":0.02,"concave points error":0.01,"symmetry error":0.02,"fractal dimension error":0.003,"worst radius":25.0,"worst texture":30.0,"worst perimeter":180.0,"worst area":2000.0,"worst smoothness":0.15,"worst compactness":0.25,"worst concavity":0.3,"worst concave points":0.15,"worst symmetry":0.4,"worst fractal dimension":0.08}]}'
      - name: Container logs
        if: always()
        run: docker compose logs --tail 50

  monitor:
    name: Verify monitoring stack
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4
      - name: Start Prometheus and Grafana
        run: docker compose up -d prometheus grafana
      - name: Prometheus healthy
        run: |
          sleep 20
          curl -f http://localhost:9090/-/healthy
      - name: Prometheus target is UP
        run: |
          curl -s 'http://localhost:9090/api/v1/targets' | python -c "import sys,json;d=json.load(sys.stdin);print([(t['labels']['job'],t['health']) for t in d['data']['activeTargets']])"
      - name: Grafana healthy
        run: |
          sleep 10
          curl -f http://localhost:3001/api/health
      - name: Cleanup
        if: always()
        run: docker compose down -v
