global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "model-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["model-server:8000"]
        labels:
          service: "ml-model-api"
          env: "docker-compose"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
