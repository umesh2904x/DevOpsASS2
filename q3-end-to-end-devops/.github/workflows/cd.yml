name: CD - Continuous Deployment

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Docker Compose
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Deploy full stack
        run: |
          export APP_VERSION=${{ steps.ver.outputs.VERSION }}
          export GIT_COMMIT=${{ github.sha }}
          export BUILD_NUMBER=${{ github.run_number }}
          docker compose up -d --build
          docker compose ps

      - name: Smoke tests
        run: |
          sleep 15
          echo "--- health ---"
          curl -f http://localhost:3000/api/health
          echo ""
          echo "--- metrics ---"
          curl -f http://localhost:3000/metrics | head -20
          echo ""
          echo "--- monitoring ---"
          curl -f http://localhost:9090/-/healthy
          curl -f http://localhost:3001/api/health

      - name: Deployment summary
        run: |
          {
            echo "## Deployment Report"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.VERSION }}\` |"
            echo "| Deployed by | \`${{ github.actor }}\` |"
            echo "| Time | \`$(date -u)\` |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Container logs
        if: always()
        run: docker compose logs --tail 60
